[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-apply-agent"
version = "0.1.0"
description = "Prepare internship and full-time applications for human approval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.10.6",
  "PyYAML==6.0.2",
  "rich==13.9.4",
  "python-dotenv==1.0.1",
  "click==8.1.8",
  "pypdf==5.2.0",
  "fastapi==0.115.8",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
retrieval = [
  "sentence-transformers==3.4.1",
  "psycopg[binary]==3.2.6",
  "pgvector==0.4.0",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
